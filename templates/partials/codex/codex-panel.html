<div class="se-cx-header">
    <span class="se-cx-title">&#x1F4D6; Character Codex</span>
    <div class="se-cx-header-btns">
        <button class="se-close-circle se-cx-fullscreen-btn" id="se-cx-fullscreen-btn" title="Fullscreen">&#x26F6;</button>
        <button class="se-close-circle se-cx-close-btn"     id="se-cx-close-btn"      title="Close">&times;</button>
    </div>
</div>

<div class="se-cx-book">

    <!-- ── LEFT PAGE — always fixed ─────────────────────────────────── -->
    <div class="se-cx-page-left">

        <!-- Voxel viewer row: canvas + 3 control buttons -->
        <div class="se-cx-voxel-row">
            <div class="se-cx-voxel-frame" id="se-cx-voxel-frame">
                <img class="se-cx-avatar" id="se-cx-avatar" src="" alt="" />
                <!-- Stage 2: Three.js canvas injected here -->
            </div>
            <div class="se-cx-voxel-ctrls">
                <button class="se-cx-vctl" id="se-cx-vctl-front" title="Front view (Stage 2)" disabled>&#9673;</button>
                <button class="se-cx-vctl" id="se-cx-vctl-spin"  title="Auto-spin (Stage 2)"  disabled>&#10227;</button>
                <button class="se-cx-vctl" id="se-cx-vctl-regen" title="Generate voxel (Stage 2)" disabled>&#10022;</button>
            </div>
        </div>

        <!-- Config fields below the voxel viewer -->
        <div class="se-cx-left-fields" id="se-cx-left-fields">

            <div class="se-cx-field-group">
                <span class="se-cx-field-lbl">Character</span>
                <div class="se-cx-char-pill" id="se-cx-char-pill">Detecting&hellip;</div>
                <select class="se-cx-char-select" id="se-cx-char-select" style="display:none;"></select>
            </div>

            <input class="se-cx-override-input" id="se-cx-override" type="text"
                   placeholder="Override character name (optional)" autocomplete="off" />

            <div class="se-cx-field-group">
                <span class="se-cx-field-lbl">Include in context</span>
                <label class="se-cx-check-row">
                    <input type="checkbox" id="se-cx-chk-supp" />
                    <span>Supplementary files</span>
                </label>
                <label class="se-cx-check-row">
                    <input type="checkbox" id="se-cx-chk-entries" />
                    <span>Summary entries</span>
                </label>
            </div>

            <div class="se-cx-token-row" id="se-cx-token-row">
                <span class="se-cx-token-est" id="se-cx-token-est">Select sources above to estimate tokens</span>
            </div>

            <button class="se-cx-gen-btn" id="se-cx-gen-btn" disabled>Generate Codex</button>

        </div>
    </div>

    <!-- ── RIGHT PAGE — content changes per page ────────────────────── -->
    <div class="se-cx-page-right">

        <!-- Progress overlay (covers right page during generation) -->
        <div class="se-cx-progress-overlay" id="se-cx-progress-overlay" style="display:none;">
            <div class="se-cx-progress-bar-wrap">
                <div class="se-cx-progress-fill" id="se-cx-progress-fill"></div>
            </div>
            <span class="se-cx-progress-txt" id="se-cx-progress-txt">Generating&hellip;</span>
        </div>

        <!-- Dynamic right-page content (TOC or section) -->
        <div class="se-cx-right-content" id="se-cx-right-content"></div>

        <!-- Paginator footer — always visible -->
        <div class="se-cx-paginator">
            <button class="se-cx-pager-arrow" id="se-cx-prev" disabled>&#8592;</button>
            <div class="se-cx-pager-dots" id="se-cx-pager-dots"></div>
            <button class="se-cx-pager-arrow" id="se-cx-next">&#8594;</button>
        </div>

    </div>

</div>
